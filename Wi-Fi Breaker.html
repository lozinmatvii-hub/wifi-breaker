  function finish(n){setTimeout(function(){if(cur===n){closeSheet();connect(n.name,'Connected to «'+n.name+'». Password cracked.')}},900)}
  function crackStep(){
    var n=cur;if(!n){stopCrack();return}
    var dt=0.1;
    drainAcc+=dt;
    if(drainAcc>=drainPeriod()){drainAcc=0;battery=Math.max(0,battery-1);spent++;lowCheck()}
    if(battery<=0){stopCrack();updateSheet();return}
    if(watched(n,dt)){stopCrack();updateSheet();startBan(n);return}
    if(lockLeft>0){lockLeft=Math.max(0,lockLeft-dt);updateSheet();return}
    if(mode==='dict'){
      dp=Math.min(1,dp+dt/(n.secs*0.2));
      if(dp>=1){
        stopCrack();
        if(n.weak){n.cracked=true;updateSheet();finish(n)}else{n.dictDone=true;dp=0;updateSheet()}
        return;
      }
    }else{
      var before=n.prog;n.prog=Math.min(1,n.prog+dt/n.secs);
      if(n.sec.indexOf('WPA3')===0){[0.33,0.66].forEach(function(th){if(before<th&&n.prog>=th){lockLeft=5;n.prog=th}})}
      if(n.prog>=1){stopCrack();n.cracked=true;updateSheet();finish(n);return}
    }
    updateSheet();
  }
  function updateSheet(){
    var n=cur;if(!n)return;
    var brute=mode==='brute',p=brute?n.prog:dp,i;
    var started=cracking||p>0||n.cracked||lockLeft>0;
    var inp=$('#pw');
    if(cracking||n.cracked){
      var v='';
      if(brute||n.cracked){
        for(i=0;i<n.len;i++){var locked=n.cracked||p>=(i+1)/n.len*0.92;v+=locked?n.password[i]:CS[n.cs][Math.floor(Math.random()*CS[n.cs].length)]}
      }else v=WORDS[Math.floor(Math.random()*WORDS.length)];
      inp.value=v;inp.readOnly=true;inp.classList.add('run');wasC=true;
    }else if(wasC){inp.value='';inp.readOnly=false;inp.classList.remove('run');wasC=false}
    updateOk();
    var ks=brute?ksOf(n):10000,secs=brute?n.secs:n.secs*0.2;
    var rows=[['Mode',brute?'Brute force':'Dictionary'],['Security',n.sec],['Charset',CSN[n.cs]],['Keyspace',brute?fnum(ks)+' combinations':'10,000 words']];
    if(started){rows.push(['Speed',fnum(ks/secs)+' H/s']);rows.push(['Tried',fnum(p*ks)]);rows.push(['Candidate',n.cracked?n.password:cracking?inp.value:'—'])}
    $('#term').innerHTML=rows.map(function(r){return '<div><span>'+r[0]+'</span><b>'+esc(r[1])+'</b></div>'}).join('');
    $('#pfill').style.width=(p*100)+'%';
    $('#ptxt').textContent=n.cracked?'Password found':lockLeft>0?'Locked out…':started?Math.floor(p*100)+'%':'Waiting';
    $('#peta').textContent=n.cracked?'':started?'About '+Math.ceil((1-p)*secs)+' s left':'About '+Math.round(secs)+' s';
    var ST=brute?STB:STD,stage=Math.min(ST.length-1,Math.floor(p*ST.length)),lg='',s2;
    if(started)for(s2=0;s2<=stage;s2++)lg+='<div>'+(s2<stage||n.cracked?'✓ ':'› ')+ST[s2]+(s2===stage&&!n.cracked?'…':'')+'</div>';
    if(lockLeft>0)lg+='<div class="warn">⚠ Network is blocking attempts (WPA3): '+Math.ceil(lockLeft)+' s</div>';
    if(!brute&&n.dictDone&&!cracking)lg+='<div class="warn">✕ Password not in dictionary. Try brute force.</div>';
    $('#plog').innerHTML=lg;
    $('#mnote').textContent=brute?'Tries every combination: slow, but finds any password.':'Quick check of popular passwords: only works on weak networks.';
    Array.prototype.forEach.call(document.querySelectorAll('#seg button'),function(b){
      b.classList.toggle('on',b.getAttribute('data-m')===mode);b.disabled=cracking||n.cracked;
    });
    var go=$('#go');
    go.textContent=n.cracked?'Done':cracking?'Stop':(!brute&&n.dictDone)?'Dictionary exhausted':(p>0?'Resume':'Start attack');
    go.disabled=n.cracked||(!brute&&n.dictDone&&!cracking);
    if(lastB!==battery){lastB=battery;renderStatus();renderSide()}
    var m=battery<=0&&!n.cracked?'<div class="alert">Battery is empty. <button class="tool" id="chg" style="margin-left:6px">Connect charger</button></div>':'';
    var msg=$('#msg');
    if(msg.getAttribute('data-s')!==m){
      msg.setAttribute('data-s',m);msg.innerHTML=m;
      var c=$('#chg');
      if(c)c.onclick=function(){charging=true;showCharge();toast('Charger connected','Battery');updateSheet()};
    }
  }

  function riskMul(){return vpn?0.25:1}
  function drainPeriod(){return (lpm?6:3)/(vpn?1.5:1)}
  function lev(a,b){
    var i,j,d=[];
    for(i=0;i<=a.length;i++){d[i]=[i]}
    for(j=1;j<=b.length;j++)d[0][j]=j;
    for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    return d[a.length][b.length];
  }
  function closest(word,list){
    var best=null,bd=1e9;
    list.forEach(function(x){var d=lev(word,x.toLowerCase());if(d<bd){bd=d;best=x}});
    return best&&bd<=Math.max(2,Math.ceil(word.length*0.45))?best:null;
  }
  function suggestNet(tk){
    var best=null,bd=1e9,rest=[],k;
    for(k=tk.length;k>=1;k--){
      var w=tk.slice(0,k).join(' ').toLowerCase();
      nets.forEach(function(n){
        var d=lev(w,n.name.toLowerCase());
        if(d<bd&&d<=Math.max(2,Math.ceil(w.length*0.45))){bd=d;best=n;rest=tk.slice(k)}
      });
    }
    return best?{n:best,rest:rest}:null;
  }
  /* ---------- risk: the network admin may notice you ---------- */
  var detAcc=0,banT=null;
  function watched(n,dt){
    detAcc+=dt;
    if(detAcc>=1){detAcc=0;return Math.random()<0.0004*(n.lvl||1)*riskMul()}
    return false;
  }
  function startBan(n){
    if($('#banwin'))return;
    stopCrack();tStop();
    var left=25,d=document.createElement('div');d.id='banwin';d.className='banwin';
    d.innerHTML='<div class="banbox" role="alertdialog" aria-modal="true"><div style="font-size:40px">⚠</div><h3>You have been noticed</h3>'+
      '<p>The admin of “'+esc(n.name)+'” is reading the connection logs. You are about to be banned. Delete your account before the timer runs out.</p>'+
      '<div class="bant" id="bant">0:25</div><button class="btn red" id="bandel">Delete Account</button></div>';
    document.body.appendChild(d);
    function end(){clearInterval(banT);banT=null;d.remove()}
    $('#bandel').onclick=function(){
      end();acct='Player';mail='';renderAll();
      toast('Account deleted. You got away.','Settings');
    };
    banT=setInterval(function(){
      left--;var t=$('#bant');if(t)t.textContent='0:'+('0'+Math.max(0,left)).slice(-2);
      if(left<=0){end();doBan()}
    },1000);
  }
  function doBan(){
    nets.forEach(function(x){x.cracked=false;x.prog=0;x.dictDone=false});
    connected='sweet_home';if(cur)updateSheet();renderAll();
    alertBox('Account Banned','You were too slow. All cracked networks were lost.',[{t:'OK',b:1}]);
  }

  /* ---------- Terminal app ---------- */
  var term={lines:[]},tJob=null,tTimer=null;
  var T_HELP=['Commands:','  help                       show this list','  scan                       list nearby networks','  status                     battery, connection, progress','  attack <ssid> [dict|brute] start an attack (default: brute)','  stop                       stop the running attack','  connect <ssid> [password]  join a network','  vpn on|off                 toggle VPN (harder to notice you)','  clear                      clear the screen','','You can use / instead of spaces: attack/osvitla/academy/dict','Partial names work.'];
  function tLog(t,cls){
    term.lines.push({t:t,c:cls||''});if(term.lines.length>300)term.lines.shift();
    var o=$('#tout');
    if(o){var d=document.createElement('div');if(cls)d.className=cls;d.textContent=t;o.appendChild(d);o.scrollTop=o.scrollHeight}
  }
  function renderTerminal(p){
    if(!term.lines.length){
      ['Wi-Fi Breaker Terminal 1.0 (game)','All networks here are fictional.',"Type 'help' for commands.",''].forEach(function(t){term.lines.push({t:t,c:'mut'})});
    }
    p.innerHTML='<div class="top"><button class="round mback" data-page="wifi" aria-label="Back">'+ICON.back+'</button><h2>Terminal</h2></div>'+
      '<div class="termwin"><div class="tout" id="tout">'+term.lines.map(function(l){return '<div'+(l.c?' class="'+l.c+'"':'')+'>'+esc(l.t)+'</div>'}).join('')+'</div>'+
      '<div class="tprompt"><span>'+esc(acct.replace(/\s+/g,'_').toLowerCase())+'@ipad ~ %</span><input id="tin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Terminal input"></div></div>';
    var o=$('#tout');o.scrollTop=o.scrollHeight;
    setTimeout(function(){var i=$('#tin');if(i&&page==='terminal')i.focus()},60);
  }
  function tMatch(tk){
    var k,name,hit;
    for(k=tk.length;k>=1;k--){
      name=tk.slice(0,k).join(' ').toLowerCase();
      hit=nets.filter(function(n){return n.name.toLowerCase()===name})[0];
      if(hit)return {n:hit,rest:tk.slice(k)};
    }
    for(k=tk.length;k>=1;k--){
      name=tk.slice(0,k).join(' ').toLowerCase();
      var c=nets.filter(function(n){return n.name.toLowerCase().indexOf(name)===0});
      if(c.length===1)return {n:c[0],rest:tk.slice(k)};
    }
    return null;
  }
  function pad(s,n){s=String(s);while(s.length<n)s+=' ';return s}
  function tStop(){clearInterval(tTimer);tTimer=null;tJob=null}
  function tRun(line){
    line=line.trim();tLog('$ '+line,'cmd');
    if(!line)return;
    var tk=line.split(/[\s\/]+/).filter(Boolean),cmd=tk[0].toLowerCase(),args=tk.slice(1),m;
    if(cmd==='help'){T_HELP.forEach(function(t){tLog(t)});return}
    if(cmd==='clear'){term.lines=[];var o=$('#tout');if(o)o.innerHTML='';return}
    if(cmd==='whoami'){tLog(acct);return}
    if(cmd==='y'&&term.sug){var sl=term.sug;term.sug=null;tRun(sl);return}
    if(cmd==='vpn'){
      var on=(args[0]||'').toLowerCase();
      if(on!=='on'&&on!=='off'){tLog('vpn: '+(vpn?'on':'off')+'  (use: vpn on|off)');return}
      vpn=on==='on';renderSide();renderStatus();save();tLog('VPN '+on,'ok');
      return;
    }
    if(cmd==='scan'){
      if(airplane||!wifiOn){tLog('error: Wi-Fi is off','err');return}
      tLog(pad('SSID',28)+pad('SEC',16)+pad('LVL',5)+'STATE');
      nets.forEach(function(n){tLog(pad(n.name,28)+pad(n.sec,16)+pad(n.lvl,5)+(n.cracked?(connected===n.name?'connected':'cracked'):n.open?'open':'locked'),n.cracked?'ok':'')});
      return;
    }
    if(cmd==='status'){
      tLog('battery:    '+battery+'%'+(charging?' (charging)':'')+(lpm?' [low power]':''));
      tLog('wi-fi:      '+((airplane||!wifiOn)?'off':connected));
      tLog('cracked:    '+cracked()+' / '+nets.length);
      tLog('attack:     '+(tJob?tJob.n.name+' ('+tJob.m+')':'none'));
      return;
    }
    if(cmd==='stop'){if(tJob){tLog('attack stopped','warn');tStop()}else tLog('nothing is running');return}
    if(cmd==='attack'||cmd==='connect'){
      m=tMatch(args);
      if(!m){
        var sg=suggestNet(args);
        if(sg){term.sug=cmd+' '+sg.n.name+(sg.rest.length?' '+sg.rest.join(' '):'');tLog('error: network not found. Did you mean “'+sg.n.name+'”? Type y to run: '+term.sug,'warn')}
        else tLog('error: network not found. try: scan','err');
        return;
      }
      var n=m.n;
      if(cmd==='connect'){
        var pw=m.rest.join(' ');
        if(n.open||n.cracked){tLog('joining '+n.name+'…');connect(n.name,'Connected to “'+n.name+'”.');return}
        if(!pw){tLog('error: password required','err');return}
        if(pw===n.password){n.cracked=true;tLog('authentication OK','ok');connect(n.name,'Connected to “'+n.name+'”.')}
        else tLog('authentication failed','err');
        return;
      }
      if(airplane||!wifiOn){tLog('error: Wi-Fi is off','err');return}
      if(n.open||n.cracked){tLog(n.name+' is already open to you','warn');return}
      if(tJob){tLog('error: an attack is already running (type: stop)','err');return}
      if(cur&&cracking){tLog('error: close the Join window first','err');return}
      if(battery<=0){tLog('error: battery is empty. charge the device','err');return}
      var mode2=(m.rest[0]||'brute').toLowerCase();
      if(mode2!=='dict'&&mode2!=='brute'){tLog('error: mode must be dict or brute','err');return}
      if(mode2==='dict'&&n.dictDone){tLog('error: dictionary already tried on '+n.name,'err');return}
      detAcc=0;
      tJob={n:n,m:mode2,dp:0,lock:0,acc:0,last:0};
      tLog('[*] target: '+n.name+'  ('+n.sec+', level '+n.lvl+')');
      tLog('[*] mode: '+(mode2==='dict'?'dictionary':'brute force'));
      tLog('[*] capturing handshake…');
      tTimer=setInterval(tStep,100);
      return;
    }
    var cs=closest(cmd,['help','scan','status','attack','stop','connect','clear','whoami','vpn']);
    if(cs){term.sug=cs+(args.length?' '+args.join(' '):'');tLog('command not found: '+cmd+'. Did you mean “'+cs+'”? Type y to run: '+term.sug,'warn')}
    else tLog('command not found: '+cmd+" (try 'help')",'err');
  }
  function tStep(){
    var j=tJob;if(!j){clearInterval(tTimer);tTimer=null;return}
    var n=j.n,dt=0.1;
    j.acc+=dt;
    if(j.acc>=drainPeriod()){j.acc=0;battery=Math.max(0,battery-1);spent++;lowCheck();renderStatus();renderSide()}
    if(battery<=0){tLog('battery empty: attack stopped','err');tStop();return}
    if(watched(n,dt)){tLog('!! the admin is reading your logs','err');tStop();startBan(n);return}
    if(j.lock>0){j.lock=Math.max(0,j.lock-dt);return}
    var brute=j.m==='brute',secs=brute?n.secs:n.secs*0.2,p;
    if(brute){
      var before=n.prog;n.prog=Math.min(1,n.prog+dt/n.secs);
      if(n.sec.indexOf('WPA3')===0){[0.33,0.66].forEach(function(th){if(before<th&&n.prog>=th){j.lock=5;n.prog=th;tLog('[!] rate limit (WPA3): waiting 5 s','warn')}})}
      p=n.prog;
    }else{j.dp=Math.min(1,j.dp+dt/secs);p=j.dp}
    var ks=brute?ksOf(n):10000,step=Math.floor(p*20);
    if(step>j.last){j.last=step;tLog('['+('  '+Math.round(p*100)).slice(-3)+'%] tried '+fnum(p*ks)+' keys  ('+fnum(ks/secs)+' H/s)')}
    if(p>=1){
      if(brute||n.weak){n.cracked=true;tLog('[+] KEY FOUND: '+n.password,'ok');tLog("    type: connect "+n.name,'mut');tStop();renderSide()}
      else{n.dictDone=true;tLog('[-] not in dictionary. try: attack '+n.name+' brute','warn');tStop()}
    }
  }

  document.addEventListener('fullscreenchange',syncFs);document.addEventListener('webkitfullscreenchange',syncFs);syncFs();
  function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
  $('#fs').addEventListener('click',function(e){
    e.stopPropagation();
    var d=document.documentElement;
    try{
      if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
      else if(d.requestFullscreen||d.webkitRequestFullscreen){var r=(d.requestFullscreen||d.webkitRequestFullscreen).call(d);if(r&&r.catch)r.catch(function(){toast('Safari did not allow full screen. Try: Share → Add to Home Screen.','Settings')})}
      else toast('This browser does not support full screen. Try: Share → Add to Home Screen.','Settings');
    }catch(err){toast('Full screen is not available here. Try: Share → Add to Home Screen.','Settings')}
  });
  load();applyDisplay();renderAll();
  window.addEventListener('pagehide',save);
  setInterval(renderStatus,30000);
  setInterval(chargeTick,1200);
  $('#chgscr').addEventListener('click',function(){this.classList.remove('on')});
})();
</script>
