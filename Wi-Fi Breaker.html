<style>
/* Layout: iPad Settings clone. Sidebar left, Wi-Fi pane right, "Join" sheet is the game. Single dark look on purpose, to match the real device. */
:root{
  --bg:#000000;
  --side:#0c0e11;
  --card:#1c1c1e;
  --field:#2c2c2e;
  --sep:#38383a;
  --fg:#ffffff;
  --dim:#8e8e93;
  --blue:#0a84ff;
  --green:#30d158;
  --orange:#ff9f0a;
  --red:#ff453a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;-webkit-font-smoothing:antialiased;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:flex;height:100%;gap:0;min-width:0}
.status{position:absolute;left:0;right:0;top:0;height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;font-weight:600;pointer-events:none;z-index:2}
.status .r{display:flex;gap:8px;align-items:center}
.batt{background:#fff;color:#000;border-radius:7px;padding:0 6px;font-size:12px;font-weight:700;line-height:17px;min-width:30px;text-align:center}
.batt.low{background:var(--red);color:#fff}

/* sidebar */
.side{width:272px;flex:none;background:var(--side);padding:56px 14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(14px,env(safe-area-inset-left,0px))}
.search{display:flex;align-items:center;gap:8px;background:#1b1d21;border-radius:22px;padding:11px 14px;color:var(--dim);font-size:16px;margin-bottom:8px}
.me{display:flex;gap:12px;align-items:center;padding:10px 4px}
.av{width:52px;height:52px;border-radius:50%;flex:none;background:conic-gradient(from 200deg,#0a84ff,#30d158,#ff9f0a,#0a84ff);display:grid;place-items:center;font-weight:700;font-size:20px}
.me b{display:block;font-size:17px}.me small{color:var(--dim);font-size:13px;line-height:1.25;display:block}
.sitem{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:22px;font-size:16px;text-align:left;width:100%}
.sitem.on{background:#1e2025}
.sitem>span:nth-child(2){white-space:nowrap}
.sitem .v{flex:none}
.sitem .v{margin-left:auto;color:var(--dim);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.ico{width:32px;height:32px;border-radius:8px;flex:none;display:grid;place-items:center}
.ico svg{width:20px;height:20px}
.gap{height:10px}

/* main */
.main{flex:1;min-width:0;overflow-y:auto;padding:56px 18px 40px;position:relative}
.wrap{max-width:900px;margin:0 auto}
.card{background:var(--card);border-radius:28px;padding:6px 18px;margin-bottom:22px}
.hero{padding:18px 0 4px}
.hero .big{width:60px;height:60px;border-radius:15px;background:linear-gradient(#2a9bff,#0a6fe8);display:grid;place-items:center}
.hero h1{font-size:25px;margin:16px 0 6px}
.hero p{color:var(--dim);margin:0 0 14px;line-height:1.35;font-size:16px;max-width:62ch}
.row{display:flex;align-items:center;gap:12px;min-height:54px;border-top:1px solid var(--sep);padding-left:0}
.row:first-child{border-top:0}
.row.pad{padding-left:44px}
.row .name{flex:1;min-width:0;overflow-wrap:anywhere}
.row .tick{position:absolute;margin-left:2px;color:var(--blue);width:28px}
.row.click{cursor:pointer}
.hd{color:var(--dim);font-weight:600;font-size:17px;margin:6px 8px 10px}
.ic{display:flex;gap:12px;align-items:center;color:#fff}
.ic svg{display:block}
.info{width:28px;height:28px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);display:grid;place-items:center;font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:16px;line-height:1}
.sw{width:51px;height:31px;border-radius:16px;background:#39393d;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.sw.on{background:var(--green)}.sw.on::after{transform:translateX(20px)}
.score{display:inline-flex;gap:8px;align-items:center;background:var(--card);border-radius:20px;padding:8px 14px;font-size:14px;color:var(--dim);margin-bottom:18px}
.score b{color:var(--fg);font-variant-numeric:tabular-nums}

.btn{background:var(--blue);color:#fff;border-radius:22px;padding:10px 18px;font-weight:600;font-size:16px}
.btn.ghost{background:var(--field);color:var(--blue)}

.spin{display:block;width:18px;height:18px;margin:3px;border:2px solid #4a4a4e;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
button.me{width:100%;text-align:left;border-radius:22px;padding:10px 8px}
button.me:hover{background:#15171b}
.pw.txt{font-family:var(--font);letter-spacing:0;font-size:18px}
.sheet .btn.ghost{flex:1}
.batt.chg{background:var(--green);color:#000;display:flex;gap:2px;align-items:center;justify-content:center}
.bigpct{font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1.1}.bigpct small{font-size:22px;color:var(--dim)}
.bar{height:14px;border-radius:7px;background:#3a3a3d;overflow:hidden}.bar i{display:block;height:100%;background:#8e8e93;border-radius:7px;transition:width .6s}.bar.chg i{background:var(--green)}
.bars{display:flex;align-items:flex-end;gap:clamp(8px,3vw,26px);height:160px;padding:0 6px;border-bottom:1px solid var(--sep)}
.bars div{flex:0 0 clamp(18px,4vw,36px);background:#4b4b4f;border-radius:6px 6px 3px 3px;transition:height .5s}
.bars div.now{background:var(--blue)}
.dl{display:flex;gap:clamp(8px,3vw,26px);padding:6px;font-size:13px;color:var(--dim)}.dl span{flex:0 0 clamp(18px,4vw,36px);text-align:center}
.stat{display:flex;gap:28px;margin:14px 0 16px}.stat small{display:block;color:var(--dim);font-size:15px}.stat b{font-size:32px;font-weight:600}.stat b i{font-size:18px;font-style:normal;color:var(--dim)}
.appico{width:34px;height:34px;border-radius:8px;flex:none;display:grid;place-items:center}
.sitem[data-page]{cursor:pointer}
.pw{min-height:58px;font-size:20px}
.pw .ph{font-family:var(--font);letter-spacing:0;color:#d0d0d4}
.pw .lk{color:var(--fg)}.pw .sc{color:#5f5f64}
.plog{min-height:100px;font-family:var(--mono);font-size:13px;line-height:1.55;color:var(--dim);margin:10px 6px 0}
.chgscr{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .7s}
.chgscr.on{opacity:1;pointer-events:auto;cursor:pointer}
.chgscr .pct{font-size:22px;color:#8e8e93;font-variant-numeric:tabular-nums}
.me.on{background:#1e2025}
.hero .big svg:not([width]){width:34px;height:34px}
.pl{display:block;width:15px;height:15px}.pl svg{width:100%;height:100%}
/* detail */
.top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.round{width:46px;height:46px;border-radius:50%;background:#1c1c1e;display:grid;place-items:center;flex:none;box-shadow:0 0 0 1px #2b2b2e}
.top h2{flex:1;text-align:center;font-size:17px;margin:0;padding-right:46px}
.link{color:var(--blue)}
.cap{color:var(--dim);font-size:13px;line-height:1.4;margin:-10px 8px 22px}
.val{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums;font-family:var(--font)}
.mono{font-family:var(--mono);letter-spacing:.08em}

/* sheet */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10;animation:fade .2s}
.sheet{background:#1c1c1e;width:min(490px,100%);max-height:100%;overflow-y:auto;border-radius:34px;padding:16px 26px 28px;position:relative;animation:rise .28s cubic-bezier(.2,.9,.3,1)}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(40px);opacity:0}}
.sh-top{display:flex;justify-content:space-between;margin:0 -12px}
.sh-top .round{background:#2c2c2e;width:44px;height:44px;box-shadow:none}
.sh-top .round.ok{color:#6a6a6e}.sh-top .round.ok.ready{background:var(--blue);color:#fff}
.sh-wifi{display:flex;justify-content:center;margin:-8px 0 26px}
.sheet h3{margin:0;font-size:22px}
.sheet .sub{color:var(--dim);font-size:19px;margin:2px 0 22px}
.pw{width:100%;background:var(--field);border:0;border-radius:28px;padding:15px 22px;color:#fff;font-size:19px;font-family:var(--mono);letter-spacing:.25em}
.pw::placeholder{font-family:var(--font);letter-spacing:0;color:#d0d0d4}
.note{color:var(--dim);font-size:14px;line-height:1.4;margin:12px 6px 0}
.pw.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.hint{display:flex;justify-content:space-between;align-items:center;margin:16px 6px 6px;font-size:14px;color:var(--dim)}
.pattern{font-family:var(--mono);letter-spacing:.35em;color:var(--fg);font-size:18px}
.tool{background:var(--field);color:var(--blue);border-radius:18px;padding:7px 12px;font-size:14px;font-weight:600}
.tool:disabled{opacity:.4;cursor:default}
.hist{margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:210px;overflow-y:auto}
.g{display:flex;align-items:center;justify-content:space-between;background:#232326;border-radius:16px;padding:8px 14px}
.g .n{font-family:var(--mono);letter-spacing:.3em;font-size:18px}
.g .dots{display:flex;gap:5px}
.d{width:12px;height:12px;border-radius:50%;background:#3a3a3d}
.d.gr{background:var(--green)}.d.or{background:var(--orange)}
.legend{display:flex;gap:14px;margin:12px 6px 0;font-size:12px;color:var(--dim);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.alert{background:#3a1d1b;color:#ffb4ae;border-radius:16px;padding:12px 14px;margin-top:14px;font-size:14px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#3a3a3c;padding:12px 20px;border-radius:24px;opacity:0;pointer-events:none;transition:.25s;z-index:20;font-size:15px;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .side{display:none}
  .main{padding:44px 0 40px}
  .card{padding:4px 14px}
  .row.pad{padding-left:34px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){

  }

    cell:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="11" r="2"/><path d="M12 13v7M7.5 6.5a6 6 0 0 0 0 9M16.5 6.5a6 6 0 0 1 0 9"/></svg>',

    app:'<svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/><path d="M12 3a9 9 0 0 0 0 18z"/></svg>',

  /* ---------- game state ---------- */
  var DEFS=[

  function rndPw(len){var s='';for(var i=0;i<len;i++)s+=Math.floor(Math.random()*10);return s}
  function resetNet(n){n.password=rndPw(n.len);n.prog=0;n.cracked=false}
  var acct=null,mem={};
  var PERSON='<svg width="30" height="30" viewBox="0 0 30 30" fill="#8e8e93"><circle cx="15" cy="11" r="5.5"/><path d="M4 27c1-6 6-9 11-9s10 3 11 9z"/></svg>';
  function ls(k,v,del){
    try{
      if(del){localStorage.removeItem(k);delete mem[k];return null}

  function hs(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h>>>0)}
  function save(){
    if(!acct||!nets)return;

  /* ---------- evaluate guess (Mastermind) ---------- */
  function evaluate(secret,guess){
    var gr=0,left={},gl=[];
    for(var i=0;i<secret.length;i++){
      if(secret[i]===guess[i])gr++;
      else{left[secret[i]]=(left[secret[i]]||0)+1;gl.push(guess[i])}
    }
    var or=0;
    gl.forEach(function(c){if(left[c]>0){or++;left[c]--}});
    return {gr:gr,or:or};
  }

      '<div class="row" style="min-height:64px"><span class="appico" style="background:linear-gradient(#2a9bff,#0a6fe8)">'+wifi(3,20)+'</span><span class="name">Wi-Fi Breaker<br><span style="color:var(--dim);font-size:15px">On screen: '+mins+'m</span></span><span class="val" style="font-size:19px">'+spent+'%</span></div>'+
      '<div class="row" style="min-height:64px"><span class="appico" style="background:#8e8e93">'+S.gen+'</span><span class="name">Settings<br><span style="color:var(--dim);font-size:15px">On screen: 6m</span></span><span class="val" style="font-size:19px">2%</span></div>'+
      '<div class="row" style="min-height:64px"><span class="appico" style="background:#0a84ff">'+S.acc+'</span><span class="name">Safari<br><span style="color:var(--dim);font-size:15px">On screen: 3m</span></span><span class="val" style="font-size:19px">1%</span></div></div>';
    p.innerHTML=h;
  }
  function renderDetail(p){
    var name=view,n=net(name),home=name==='sweet_home';
    var known=home||n.cracked;
    var pw=home?'12345678':n.password;
    var shown=reveal[name];
    var h='<div class="top"><button class="round" data-back aria-label="Back">'+ICON.back+'</button><h2>'+name+'</h2></div>'+
      '<div class="card"><div class="row click" data-forget><span class="link">Forget This Network</span></div></div>'+
      '<div class="card"><div class="row"><span class="name">Auto-Join</span><button class="sw'+(autoJoin[name]!==false?' on':'')+'" data-auto aria-label="Auto-Join"></button></div>'+
      '<div class="row click" data-pw><span class="name">Password</span><span class="val '+(shown&&known?'mono':'')+'">'+
        (known?(shown?pw:'●●●●●●●●'):'Невідомо')+'</span></div></div>'+
      '<div class="cap">'+(known?'Тапни рядок Password, щоб показати або сховати пароль.':'Пароль ще не зламано. Відкрий Join та підбери код.')+'</div>'+
      '<div class="card"><div class="row"><span class="name">Security</span><span class="val">WPA2 Personal</span></div>'+
      '<div class="row"><span class="name">Довжина коду</span><span class="val">'+(home?8:n.len)+' цифр</span></div>'+
      '<div class="row"><span class="name">Сигнал</span><span class="val">'+['','слабкий','середній','сильний'][n?n.signal:3]+'</span></div>'+
      '<div class="row"><span class="name">Wi-Fi Type</span><span class="val">Wi-Fi 5 (802.11ac)</span></div></div>';
    p.innerHTML=h;
  }

  /* ---------- join sheet: password cracking takes time ---------- */
  var cur=null,crackTimer=null,cracking=false,drainAcc=0,lastB=-1;
  var STAGES=['Пошук мережі та handshake','Перехоплення пакетів','Підбір за словником','Перебір комбінацій','Перевірка збігу'];
  function openSheet(name){
    var n=net(name);
    cur=n;cracking=false;drainAcc=0;lastB=-1;
    var host=$('#sheetHost');
    host.innerHTML='<div class="dim" id="dim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Join '+n.name+'">'+
      '<div class="sh-top"><button class="round" id="sx" aria-label="Cancel">'+ICON.x+'</button><button class="round ok ready" id="sok" aria-label="Start">'+ICON.check+'</button></div>'+
      '<div class="sh-wifi">'+bigWifi()+'</div>'+
      '<h3>Join “'+n.name+'”</h3><div class="sub">Enter the password to join this Wi-Fi network.</div>'+
      '<div class="pw" id="pw" role="status"></div>'+
      '<div class="bar" style="margin:16px 6px 0"><i id="pfill" style="width:0"></i></div>'+
      '<div class="hint"><span id="ptxt"></span><span id="peta"></span></div>'+
      '<div class="plog" id="plog"></div>'+
      '<button class="btn" id="go" style="margin-top:18px;width:100%">Почати підбір</button>'+
      '<div class="note">Підбір займає час: що сильніша мережа, то довше. Він іде, поки це вікно відкрите, і витрачає батарею.</div>'+
      '<div id="msg"></div></div></div>';
    $('#sx').onclick=closeSheet;$('#sok').onclick=toggleCrack;$('#go').onclick=toggleCrack;
    $('#dim').addEventListener('mousedown',function(e){if(e.target.id==='dim')closeSheet()});
    updateSheet();
  }
  function toggleCrack(){
    var n=cur;if(!n||n.cracked)return;
    if(cracking){stopCrack();updateSheet();return}
    if(battery<=0){updateSheet();return}
    cracking=true;
    crackTimer=setInterval(crackStep,100);
    updateSheet();
  }
  function stopCrack(){cracking=false;clearInterval(crackTimer);crackTimer=null}
  function crackStep(){
    var n=cur;if(!n){stopCrack();return}
    n.prog=Math.min(1,n.prog+0.1/n.secs);
    drainAcc+=0.1;
    if(drainAcc>=3){drainAcc=0;battery=Math.max(0,battery-1);spent++}
    if(battery<=0)stopCrack();
    if(n.prog>=1){
      stopCrack();n.cracked=true;updateSheet();
      setTimeout(function(){if(cur===n){closeSheet();connect(n.name,'Пароль підібрано. Підключено до «'+n.name+'».')}},900);
      return;
    }
    updateSheet();
  }
  function updateSheet(){
    var n=cur;if(!n)return;
    var p=n.prog,h='',i;
    if(p<=0&&!cracking)h='<span class="ph">Password</span>';
    else for(i=0;i<n.len;i++){
      var locked=n.cracked||p>=(i+1)/n.len*0.92;
      h+=locked?'<span class="lk">'+n.password[i]+'</span>':'<span class="sc">'+Math.floor(Math.random()*10)+'</span>';
    }
    $('#pw').innerHTML=h;
    $('#pfill').style.width=(p*100)+'%';
    var started=p>0||cracking;
    $('#ptxt').textContent=n.cracked?'Пароль знайдено':(started?Math.floor(p*100)+'%':'Очікування');
    $('#peta').textContent=n.cracked?'':(started?'Залишилось ~'+Math.ceil((1-p)*n.secs)+' с':'Орієнтовно '+n.secs+' с');
    var stage=Math.min(STAGES.length-1,Math.floor(p*STAGES.length)),lg='';
    if(started)for(var s2=0;s2<=stage;s2++)lg+='<div>'+(s2<stage||n.cracked?'✓ ':'› ')+STAGES[s2]+(s2===stage&&!n.cracked?'…':'')+'</div>';
    $('#plog').innerHTML=lg;
    $('#go').textContent=n.cracked?'Готово':cracking?'Пауза':(p>0?'Продовжити':'Почати підбір');
    if(lastB!==battery){lastB=battery;renderStatus();renderSide()}
    var m=battery<=0&&!n.cracked?'<div class="alert">Батарея розряджена. <button class="tool" id="chg" style="margin-left:6px">Підключити зарядку</button></div>':'';
    var msg=$('#msg');
    if(msg.getAttribute('data-s')!==m){
      msg.setAttribute('data-s',m);msg.innerHTML=m;
      var c=$('#chg');
      if(c)c.onclick=function(){charging=true;showCharge();toast('Зарядку підключено');updateSheet()};
    }
  }
  function closeSheet(){stopCrack();cur=null;$('#sheetHost').innerHTML='';renderAll()}

  /* ---------- events ---------- */
  document.addEventListener('click',function(e){
    var t=e.target;
    var inf=t.closest('[data-info]');
    if(inf){view=inf.getAttribute('data-info');renderPane();e.stopPropagation();return}
    var j=t.closest('[data-join]');
    if(j){
      var name=j.getAttribute('data-join');
      if(name===connected)return;
      if(name==='sweet_home'){connect(name,'Підключено до домашньої мережі');return}
      var n=net(name);
      if(n.cracked){connect(name,'Підключено до «'+name+'»');return}
      openSheet(name);return;
    }
    if(t.closest('[data-back]')){view=null;renderPane();return}
    if(t.closest('[data-acct]')){if(acct){page='account';view=null;gsub=null;renderAll()}else openAcct();return}
    if(t.closest('[data-air]')){airplane=!airplane;toast(airplane?'Режим польоту увімкнено':'Режим польоту вимкнено');renderAll();return}
    if(t.closest('[data-wifi]')){if(airplane)toast('Спершу вимкни режим польоту');else wifiOn=!wifiOn;renderAll();return}
    if(t.closest('[data-bt]')){if(airplane)toast('Спершу вимкни режим польоту');else btOn=!btOn;renderAll();return}
    if(t.closest('[data-btdev]')){toast('CW-TWS2 поза зоною дії');return}
    var gs=t.closest('[data-gsub]');
    if(gs){var gk=gs.getAttribute('data-gsub');if(gk==='x')toast('Недоступно в грі');else{gsub=gk;renderPane()}return}
    if(t.closest('[data-gback]')){gsub=null;renderPane();return}
    if(t.closest('[data-reset]')){newGame();renderAll();toast('Прогрес скинуто');return}
    if(t.closest('[data-signout]')){save();acct=null;ls('wb_cur',null,true);newGame();page='wifi';renderAll();toast('Ви вийшли з акаунта');return}
    var pgEl=t.closest('[data-page]');
    if(pgEl){page=pgEl.getAttribute('data-page');view=null;gsub=null;renderAll();return}
    if(t.closest('[data-chg]')){charging=!charging;if(charging)showCharge();else $('#chgscr').classList.remove('on');toast(charging?'Зарядку підключено':'Зарядку відключено');renderAll();return}
    if(t.closest('[data-again]')){newGame();renderAll();return}
    if(t.closest('[data-auto]')){autoJoin[view]=autoJoin[view]===false;renderPane();return}
    if(t.closest('[data-pw]')){
      var n2=net(view);if(view==='sweet_home'||n2.cracked){reveal[view]=!reveal[view];renderPane()}
      else toast('Пароль ще невідомий');
      return;
    }
    if(t.closest('[data-forget]')){
      if(view==='sweet_home'){toast('Це твоя домашня мережа, її не забуваємо');return}
      var n3=net(view);resetNet(n3);if(connected===view)connected='sweet_home';
      view=null;renderAll();toast('Мережу забуто. Роутер згенерував новий пароль.');
    }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&(cur||$('#acct')))closeSheet();
    if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.row.click,.sitem[data-page]')){e.preventDefault();e.target.click()}
  });

  function renderAll(){renderStatus();renderSide();renderPane();save()}
  newGame();renderAll();
  setInterval(renderStatus,30000);
  setInterval(chargeTick,1200);
  $('#chgscr').addEventListener('click',function(){this.classList.remove('on')});
  autoLogin();
})();
</script>

</body></html>
